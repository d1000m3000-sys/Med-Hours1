<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Med Hours</title>

    <meta name="theme-color" content="#0d9488">
    <meta name="description" content="تطبيق تذكير بمواعيد الأدوية">

    <link rel="manifest" href="./manifest.json">

    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

    <link rel="apple-touch-icon" href="./icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Med Hours">

    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-teal">

<header>
    <h1>Med Hoursذ</h1>

    <div style="display:flex;gap:10px;align-items:center;">
        <button id="installBtn" class="icon-btn" style="display:none;">📲</button>
        <button id="themeToggle" class="icon-btn">⚙️</button>
    </div>
</header>

<main>

<div class="card">
<h2>إضافة دواء جديد</h2>

<div class="input-group">
<label for="medName">اسم الدواء</label>
<input type="text" id="medName" placeholder="أدخل اسم الدواء">
</div>

<div class="input-group">
<label for="medDateTime">تاريخ ووقت الجرعة</label>
<input type="datetime-local" id="medDateTime">
</div>

<button id="saveMedBtn" class="btn btn-primary">
💾 حفظ الدواء
</button>

</div>

<div class="card">

<h2>إضافة مدة متكررة</h2>

<div class="quick-hours">

<button class="btn btn-quick" data-hours="4">
كل 4 ساعات
</button>

<button class="btn btn-quick" data-hours="8">
كل 8 ساعات
</button>

<button class="btn btn-quick" data-hours="12">
كل 12 ساعة
</button>

<button class="btn btn-quick" data-hours="24">
كل 24 ساعة
</button>

</div>

</div>

<div class="card">

<h2>المظهر</h2>

<div class="theme-picker">

<button class="theme-dot theme-teal" data-theme="teal"></button>

<button class="theme-dot theme-blue" data-theme="blue"></button>

<button class="theme-dot theme-purple" data-theme="purple"></button>

<button class="theme-dot theme-rose" data-theme="rose"></button>

<button class="theme-dot theme-amber" data-theme="amber"></button>

</div>

</div>

<div class="card">

<h2>أدويتي</h2>

<div id="medList"></div>

</div>

</main>

<div id="installPrompt" class="install-banner" style="display:none;">
    <div class="banner-content">
        <span>📱 ثبّت التطبيق للوصول السريع</span>

        <button id="installBannerBtn" class="btn btn-primary" style="width:auto;padding:10px 20px;">
            تثبيت
        </button>

        <button id="dismissBanner" style="background:none;border:none;font-size:24px;cursor:pointer;">
            ✕
        </button>
    </div>
</div>

<footer class="footer">
    <p><strong>Med Hours v1.0</strong></p>
    <p>Developed by <strong>Ahmed</strong> ❤️</p>
</footer>
<script src="./app.js"></script>
</body>
</html>
